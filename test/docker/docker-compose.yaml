services:
  alpine-du-tree:
    build:
      context: .
      dockerfile: ./alpine/Dockerfile
    ports:
      - "51202:51202"
    volumes:
      - ../../:/app:ro
    user: "1000:1000"

  fedora-du-tree:
    build:
      context: ./fedora
      dockerfile: Dockerfile
    ports:
      - "51203:51203"
    volumes:
      - ../../:/app:ro
    user: "1000:1000"

  debian-du-tree:
    build:
      context: ./debian
      dockerfile: Dockerfile
    ports:
      - "51204:51204"
    volumes:
      - /:/outer
    # - ../../:/app:ro

    user: "1000:1000"
