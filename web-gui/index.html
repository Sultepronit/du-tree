<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DU-Tree v{{VERSION}}</title>

        <link rel="stylesheet" href="app-v{{VERSION}}.css" />
        <script type="module" src="app-v{{VERSION}}.js"></script>
    </head>
    <body>
        <div class="header">
            <div class="search-container" style="position: relative">
                <div class="path-plus">
                    <div id="access-widged"></div>
                    <input
                        type="text"
                        name="path"
                        id="path"
                        placeholder="Input the directory path"
                        spellcheck="false"
                        autocorrect="off"
                        autocapitalize="off"
                        data-gramm="false"
                        autocomplete="off"
                    />
                    <!-- <button class="icon-button" id="scan" title="Run analysis&#10;(Enter)"></button> -->
                    <button class="icon-button" id="scan" disabled autocomplete="off"></button>
                    <input
                        type="checkbox"
                        id="auto-exit"
                        autocomplete="off"
                        title="Auto-exit server on page close&#9;[Ctrl+Q]"
                    />
                </div>

                <div class="suggestions-block hidden">
                    <div id="pre-suggestions"></div>
                    <div id="suggestions-box" class="suggestions"></div>
                </div>
            </div>

            <div class="settings">
                <form id="options">
                    <fieldset id="scanset">
                        <div>
                            <label>
                                <input type="radio" name="size-type" value="block" checked />
                                Block size
                            </label>
                            <label>
                                <input type="radio" name="size-type" value="apparent" />
                                Apparent size
                            </label>
                        </div>

                        <label>
                            <input type="checkbox" name="one-fs" autocomplete="off" />
                            One FS
                        </label>

                        <label id="exlude-label">
                            <input type="checkbox" name="exclude" autocomplete="off" />
                            Exclude
                        </label>
                    </fieldset>

                    <!-- <label>
                        <input type="checkbox" id="show-hidden" autocomplete="on" />
                        Show hidden
                    </label>

                    <label>
                        <input type="checkbox" id="use-animation" autocomplete="on" />
                        Animations
                    </label> -->
                </form>

                <form id="filters">
                    <label>
                        <input type="checkbox" id="show-hidden" autocomplete="on" />
                        Show hidden
                    </label>

                    <label>
                        <input type="checkbox" id="more-than" autocomplete="on" />
                        > 2% of parent
                    </label>
                </form>

                <label>
                    <input type="checkbox" id="use-animation" autocomplete="on" />
                    Animations
                </label>
            </div>

            <form id="exclude-form" hidden>
                <fieldset id="excludeset">
                    <h4>Exclude:</h4>

                    <label>
                        <input type="checkbox" name="hidd" autocomplete="off" />
                        Hidden
                    </label>

                    <input type="text" name="patt" id="ex1" autocomplete="off" />
                </fieldset>
            </form>

            <div class="tree-root" id="tree-root">
                <div id="total-size"></div>
                <div
                    id="lock-widget"
                    class="hidden"
                    title="Counter of dirs with no access, meaning no size evaluation.&#10; Run as root to get the full size."
                ></div>
                <div class="scan-progress"></div>
                <button
                    class="icon-button"
                    id="rescan-button"
                    title="The scan was canceled.&#10; Click to rescan&#9;[Shift+Enter]"
                ></button>
                <!-- <button id="rescan-button"></button> -->
                <button id="cancel" title="[Esc]">Cancel</button>
            </div>
        </div>

        <div id="tree"></div>
    </body>
</html>
