<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/icon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Disk Usage Tree 0.7.4</title>
        <link rel="stylesheet" href="style/main.css" />
        <link rel="stylesheet" href="style/header-design.css" />
        <link rel="stylesheet" href="style/tree-design.css" />
        <link rel="stylesheet" href="style/icons.css" />

        <script type="module" src="main.js"></script>
    </head>
    <body>
        <div class="header">
            <div class="search-container" style="position: relative">
                <div class="path-plus">
                    <div id="access-widged"></div>
                    <input
                        type="text"
                        name="path"
                        id="path"
                        placeholder="Input the directory path"
                        spellcheck="false"
                        autocorrect="off"
                        autocapitalize="off"
                        data-gramm="false"
                        autocomplete="off"
                    />
                    <div class="scan-wrap"><button id="scan"></button></div>
                </div>

                <div class="suggestions-block hidden">
                    <div id="pre-suggestions"></div>
                    <div id="suggestions-box" class="suggestions"></div>
                </div>
            </div>

            <div class="flex1">
                <div class="tree-root">
                    <div id="total-size"></div>
                    <div id="lock-widget" class="hidden"></div>
                    <button id="cancel">Abort</button>
                </div>
                <div class="options">
                    <label>
                        <input type="checkbox" name="use-block-size" id="use-block-size" checked />
                        block size
                    </label>
                </div>
            </div>
        </div>

        <div id="tree"></div>
    </body>
</html>
